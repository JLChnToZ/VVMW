name: Build Docs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'Packages/manifest.json'
      - 'Packages/packages-lock.json'
      - 'Packages/vpm-manifest.json'
      - 'Packages/idv.jlchntoz.vvmw/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve VPM packages
        uses: anatawa12/sh-actions/resolve-vpm-packages@master
        with:
          project-path: .
          repos: |
            https://xtlcdn.github.io/vpm/index.json
            https://vpm.pimaker.at/index.json
            https://redsim.github.io/vpmlisting/index.json

      - name: Install DocFX
        working-directory: ${{ runner.temp }}
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/docfx-tools" docfx || \
          dotnet tool update --tool-path "$RUNNER_TEMP/docfx-tools" docfx
          echo "$RUNNER_TEMP/docfx-tools" >> "$GITHUB_PATH"

      - name: Update DocFX config with GitHub Pages URL
        run: |
          sed -i "s|\$baseUrl|${SITE_URL}|g" docs/docfx.fallback.json
          sed -i "s|\$xrefMap|${SITE_URL}/xrefmap.yml|g" docs/docfx.fallback.json

      - name: Build documentation from source
        run: |
          rm -rf docs/api
          docfx docs/docfx.fallback.json
          api_count=$(find docs/api -maxdepth 1 -name '*.yml' | wc -l)
          echo "API yaml count: $api_count"
          test "$api_count" -gt 0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
name: Build Docs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'Assets/Editor/DocfxProjectFileGenerator.cs'
      - 'CHANGELOG.md'
      - 'Packages/manifest.json'
      - 'Packages/packages-lock.json'
      - 'Packages/vpm-manifest.json'
      - 'Packages/idv.jlchntoz.vvmw/**'
      - 'ProjectSettings/ProjectVersion.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: 2022.3.22f1
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-docs-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-docs-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve VPM packages
        uses: anatawa12/sh-actions/resolve-vpm-packages@master
        with:
          project-path: .
          repos: |
            https://xtlcdn.github.io/vpm/index.json
            https://vpm.pimaker.at/index.json
            https://redsim.github.io/vpmlisting/index.json

      - name: Remove stale Unity project files
        run: |
          find . -maxdepth 1 \( -name '*.csproj' -o -name '*.csproj.lscache' -o -name '*.sln' \) -delete

      - name: Generate Unity project files
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          allowDirtyBuild: true
          buildMethod: JLChnToZ.VRC.VVMW.Editor.DocfxProjectFileGenerator.Generate

      - name: Validate generated project files
        run: |
          test -f JLChnToZ.VVMW.csproj
          test -f JLChnToZ.VVMW.Editor.csproj

      - name: Prepare DocFX project files
        run: |
          for f in \
            JLChnToZ.VVMW.csproj \
            JLChnToZ.VVMW.Editor.csproj \
            JLChnToZ.VRC.Foundation.csproj \
            JLChnToZ.VRC.Foundation.Editor.csproj \
            LazySwitch.Editor.csproj \
            LazySwitch.Runtime.csproj
          do
            if [ -f "$f" ]; then
              cp "$f" "Docfx.$f"
              sed -i 's#<NoStandardLibraries>true</NoStandardLibraries>#<NoStandardLibraries>false</NoStandardLibraries>#g' "Docfx.$f"
              sed -i 's#<NoStdLib>true</NoStdLib>#<NoStdLib>false</NoStdLib>#g' "Docfx.$f"
              sed -i 's#<NoConfig>true</NoConfig>#<NoConfig>false</NoConfig>#g' "Docfx.$f"
              sed -i 's#<DisableImplicitFrameworkReferences>true</DisableImplicitFrameworkReferences>#<DisableImplicitFrameworkReferences>false</DisableImplicitFrameworkReferences>#g' "Docfx.$f"
            fi
          done
          test -f Docfx.JLChnToZ.VVMW.csproj
          test -f Docfx.JLChnToZ.VVMW.Editor.csproj

      - name: Install DocFX
        working-directory: ${{ runner.temp }}
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/docfx-tools" docfx || \
          dotnet tool update --tool-path "$RUNNER_TEMP/docfx-tools" docfx
          echo "$RUNNER_TEMP/docfx-tools" >> "$GITHUB_PATH"

      - name: Update docfx.json with GitHub Pages URL
        run: |
          sed -i "s|\$baseUrl|${SITE_URL}|g" docs/docfx.json
          sed -i "s|\$xrefMap|${SITE_URL}/xrefmap.yml|g" docs/docfx.json
          sed -i "s|\$baseUrl|${SITE_URL}|g" docs/docfx.fallback.json
          sed -i "s|\$xrefMap|${SITE_URL}/xrefmap.yml|g" docs/docfx.fallback.json

      - name: Build the documentation
        run: |
          rm -rf docs/api
          docfx docs/docfx.json
          api_count=$(find docs/api -maxdepth 1 -name '*.yml' | wc -l)
          if [ "$api_count" -eq 0 ]; then
            echo "Primary metadata produced no API yaml, running source fallback..."
            rm -rf docs/api
            docfx docs/docfx.fallback.json
            api_count=$(find docs/api -maxdepth 1 -name '*.yml' | wc -l)
          fi
          echo "API yaml count: $api_count"
          test "$api_count" -gt 0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4